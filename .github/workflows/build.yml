name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for the release (e.g. v2.2.2)"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Deno (latest) ───────────────────────────────────────────────────────
      - name: Download latest Deno for Windows
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/denoland/deno/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -eq "deno-x86_64-pc-windows-msvc.zip" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "deno.zip"
          New-Item -ItemType Directory -Force -Path "deno\bin" | Out-Null
          Expand-Archive -Path "deno.zip" -DestinationPath "deno\bin" -Force
          Remove-Item "deno.zip"
          Write-Host "Deno version: $(& deno\bin\deno.exe --version)"

      # ── PyInstaller build ────────────────────────────────────────────────────
      - name: Build executable with PyInstaller
        run: >
          pyinstaller
          --onefile
          --noconsole
          "--add-data=ffmpeg;ffmpeg"
          "--add-data=deno;deno"
          "--add-data=icon.png;."
          "--add-data=icon.ico;."
          "--add-data=favicon.ico;."
          --icon="favicon.ico"
          --name="YouTube_Downloader"
          ytvd.py

      # ── Package release artifact ─────────────────────────────────────────────
      - name: Package into ZIP
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          Compress-Archive -Path "dist\YouTube_Downloader.exe" -DestinationPath "YouTube_Downloader_${tag}_windows.zip"
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "YouTube-Downloader ${{ env.RELEASE_TAG }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            YouTube_Downloader_${{ env.RELEASE_TAG }}_windows.zip
